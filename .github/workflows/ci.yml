name: CI

# Push su main e pull request: un solo giro per ogni modifica proposta
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Un nuovo push sullo stesso branch annulla il giro precedente
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
