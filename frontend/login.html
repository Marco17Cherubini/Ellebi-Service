<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accedi - Ellebi Service SRL</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body class="auth-page">
    <a class="skip-link" href="#contenuto">Vai al contenuto</a>
    <header class="site-bar">
      <a class="wordmark" href="/" aria-label="Ellebi Service, pagina iniziale">
        <span class="wordmark-block" aria-hidden="true"></span>Ellebi<span class="wordmark-sub"
          >Service</span
        >
      </a>
      <div class="site-bar-actions">
        <a class="btn btn-primary btn-sm" href="/prenota">Prenota</a>
      </div>
    </header>
    <main class="center-container auth" id="contenuto">
      <div class="form">
        <h1>Accedi</h1>

        <div id="success-message" class="form-success hidden"></div>
        <div id="error-message" class="form-error hidden"></div>

        <form id="login-form">
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              class="form-input"
              required
              placeholder="mario.rossi@example.com"
            />
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              id="password"
              autocomplete="current-password"
              name="password"
              class="form-input"
              required
              placeholder="La tua password"
            />
          </div>

          <button type="submit" class="btn btn-primary btn-full">Accedi</button>
        </form>

        <p class="text-center mt-2">
          Non hai un account? <a href="/register" class="link">Registrati</a>
        </p>
        <p class="text-center" style="margin-top: 8px">
          <a href="/reset-password" class="link">Password dimenticata?</a>
        </p>
        <p class="auth-aside">
          Per prenotare non serve un account: <a href="/prenota">prenota come ospite</a>.
        </p>
      </div>
    </main>

    <script src="/js/theme.js"></script>
    <script src="/js/login.js"></script>
    <script src="/js/legal-footer.js"></script>
  </body>
</html>
