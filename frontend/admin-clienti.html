<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestione Clienti - Ellebi Service SRL</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/styles/pages/admin-clienti.css" />
  </head>

  <body>
    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Sidebar Menu -->
    <nav id="sidebar" class="sidebar" aria-label="Pannello officina">
      <div class="sidebar-header">
        <a href="/admin" class="brand" aria-label="Ellebi Service, agenda"
          ><img
            src="/images/logo-ellebi.svg"
            width="69"
            height="52"
            alt="Ellebi Service S.R.L. di Lorenzo Barbetta"
        /></a>
        <span class="sidebar-logo-link">Officina</span>
        <button type="button" id="close-sidebar" class="sidebar-close" aria-label="Chiudi il menu">
          &times;
        </button>
      </div>
      <div class="sidebar-nav">
        <a href="/admin" class="sidebar-item">
          <span>Agenda</span>
        </a>
        <a href="/admin/reports" class="sidebar-item">
          <span>Report</span>
        </a>
        <a href="/admin/clienti" class="sidebar-item active" aria-current="page">
          <span>Clienti</span>
        </a>
        <a href="/admin/depositi" class="sidebar-item">
          <span>Lavori straordinari</span>
        </a>
        <a href="/admin/listino" class="sidebar-item">
          <span>Listino</span>
        </a>
      </div>
      <div class="sidebar-footer">
        <button type="button" id="sidebar-logout" class="sidebar-item sidebar-logout">
          <span>Esci</span>
        </button>
      </div>
    </nav>

    <div class="header">
      <div class="header-left">
        <button
          type="button"
          id="hamburger-btn"
          class="hamburger-btn"
          aria-label="Apri il menu"
          aria-controls="sidebar"
        >
          Menu
        </button>
        <span class="header-title">Clienti</span>
      </div>
    </div>

    <div class="container">
      <h2 class="page-title">Gestione Clienti</h2>
      <p class="page-subtitle">Gestisci lo stato VIP e BAN dei clienti</p>

      <div class="clienti-container">
        <div class="search-box">
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="Cerca per nome o cognome..."
          />
        </div>

        <div id="users-count" class="users-count"></div>

        <div id="users-list" class="users-list">
          <div class="no-users">Caricamento...</div>
        </div>
      </div>
    </div>

    <!-- Barra conferma modifiche -->
    <div id="confirm-bar" class="confirm-bar">
      <div class="changes-info">
        <span id="changes-count">0 modifiche</span> in attesa di conferma
      </div>
      <div>
        <button type="button" id="cancel-changes-btn" class="btn-cancel">Annulla</button>
        <button type="button" id="confirm-changes-btn" class="btn-confirm">Conferma</button>
      </div>
    </div>

    <script src="/js/theme.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/admin-clienti.js"></script>
  </body>
</html>
