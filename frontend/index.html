<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ellebi Service · Officina auto e moto a San Giuliano Vecchio</title>
    <meta
      name="description"
      content="Officina auto e moto a San Giuliano Vecchio (AL). Accedi, registrati o prenota come ospite."
    />
    <meta name="theme-color" content="#101317" />
    <link
      rel="preload"
      href="/fonts/saira-condensed-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/images/auto-assemblata.webp" as="image" fetchpriority="high" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/styles/pages/entry.css" />

  <!-- Ingresso: come in origine si entra solo da accesso, registrazione o prenotazione
       come ospite. Nessun collegamento dipende dalla sessione o porta all'area riservata. -->
  <body class="entry">
    <main class="entry-main" id="contenuto">
      <div class="entry-stage" aria-hidden="true">
        <div class="sign">
          <img src="/images/logo-ellebi.svg" alt="" width="1179" height="883" />
        </div>
        <img
          class="entry-car"
          src="/images/auto-assemblata.webp"
          width="1120"
          height="688"
          alt=""
          fetchpriority="high"
        />
      </div>

      <div class="entry-text">
        <p class="entry-eyebrow">Benvenuto da</p>
        <h1 class="entry-title">Ellebi Service</h1>
        <p class="entry-sub">Officina auto e moto · San Giuliano Vecchio (AL)</p>
      </div>

      <nav class="entry-ways" aria-label="Come vuoi entrare">
        <a class="btn btn-primary btn-lg btn-full" href="/login">Accedi</a>
        <a class="btn btn-lg btn-full" href="/register">Registrati</a>
        <a class="btn btn-quiet btn-full" href="/guest-booking">Prenota come ospite</a>
      </nav>

      <p class="entry-call">Preferisci chiamare? <a href="tel:+393663043908">366 304 3908</a></p>
    </main>

    <script src="/js/theme.js"></script>
    <script src="/js/legal-footer.js"></script>
  </body>
</html>
