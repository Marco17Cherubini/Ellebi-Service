<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuova Password - Ellebi Service SRL</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body class="auth-page">
    <a class="skip-link" href="#contenuto">Vai al contenuto</a>
    <header class="site-bar">
      <a class="brand" href="/" aria-label="Ellebi Service, pagina iniziale"
        ><img
          src="/images/logo-ellebi.svg"
          width="69"
          height="52"
          alt="Ellebi Service S.R.L. di Lorenzo Barbetta"
      /></a>
      <div class="site-bar-actions">
        <a class="btn btn-primary btn-sm" href="/prenota">Prenota</a>
      </div>
    </header>
    <main class="center-container auth sheet" id="contenuto">
      <div class="form">
        <h1>Imposta Nuova Password</h1>
        <p class="text-center" style="color: var(--color-text-secondary); margin-bottom: 24px">
          Inserisci la tua nuova password.
        </p>

        <div id="success-message" class="form-success hidden"></div>
        <div id="error-message" class="form-error hidden"></div>

        <form id="new-password-form">
          <div class="form-group">
            <label for="password" class="form-label">Nuova Password</label>
            <input
              type="password"
              id="password"
              autocomplete="new-password"
              name="password"
              class="form-input"
              required
              placeholder="Minimo 8 caratteri"
              minlength="8"
            />
          </div>

          <div class="form-group">
            <label for="confirm-password" class="form-label">Conferma Password</label>
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              class="form-input"
              required
              placeholder="Ripeti la password"
            />
          </div>

          <button type="submit" class="btn btn-primary btn-full">Salva Password</button>
        </form>

        <p class="text-center mt-2">
          <a href="/login" class="link">Torna al Login</a>
        </p>
      </div>
    </main>

    <script src="/js/theme.js"></script>
    <script src="/js/new-password.js"></script>
    <script src="/js/legal-footer.js"></script>
  </body>
</html>
