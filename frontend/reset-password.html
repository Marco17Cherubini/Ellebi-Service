<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recupera Password - Ellebi Service SRL</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body class="auth-page">
    <a class="skip-link" href="#contenuto">Vai al contenuto</a>
    <header class="site-bar">
      <a class="wordmark" href="/" aria-label="Ellebi Service, pagina iniziale">
        <span class="wordmark-block" aria-hidden="true"></span>Ellebi<span class="wordmark-sub"
          >Service</span
        >
      </a>
      <div class="site-bar-actions">
        <a class="btn btn-primary btn-sm" href="/prenota">Prenota</a>
      </div>
    </header>
    <main class="center-container auth" id="contenuto">
      <div class="form">
        <h1>Recupera Password</h1>
        <p class="text-center" style="color: var(--color-text-secondary); margin-bottom: 24px">
          Inserisci la tua email e ti invieremo un link per reimpostare la password.
        </p>

        <div id="success-message" class="form-success hidden"></div>
        <div id="error-message" class="form-error hidden"></div>

        <form id="reset-form">
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              class="form-input"
              required
              placeholder="mario.rossi@example.com"
            />
          </div>

          <button type="submit" class="btn btn-full">Invia Link di Reset</button>
        </form>

        <p class="text-center mt-2">
          <a href="/login" class="link">Torna al Login</a>
        </p>
      </div>
    </main>

    <script src="/js/theme.js"></script>
    <script src="/js/reset-password.js"></script>
    <script src="/js/legal-footer.js"></script>
  </body>
</html>
