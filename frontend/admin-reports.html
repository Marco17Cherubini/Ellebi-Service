<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resoconto Clientela - Ellebi Service SRL</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/styles/pages/admin-reports.css" />
  </head>

  <body>
    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Sidebar Menu -->
    <nav id="sidebar" class="sidebar" aria-label="Pannello officina">
      <div class="sidebar-header">
        <a href="/admin" class="brand" aria-label="Ellebi Service, agenda"
          ><img
            src="/images/logo-ellebi.svg"
            width="69"
            height="52"
            alt="Ellebi Service S.R.L. di Lorenzo Barbetta"
        /></a>
        <span class="sidebar-logo-link">Officina</span>
        <button type="button" id="close-sidebar" class="sidebar-close" aria-label="Chiudi il menu">
          &times;
        </button>
      </div>
      <div class="sidebar-nav">
        <a href="/admin" class="sidebar-item">
          <span>Agenda</span>
        </a>
        <a href="/admin/reports" class="sidebar-item active" aria-current="page">
          <span>Report</span>
        </a>
        <a href="/admin/clienti" class="sidebar-item">
          <span>Clienti</span>
        </a>
        <a href="/admin/depositi" class="sidebar-item">
          <span>Lavori straordinari</span>
        </a>
        <a href="/admin/listino" class="sidebar-item">
          <span>Listino</span>
        </a>
      </div>
      <div class="sidebar-footer">
        <button type="button" id="sidebar-logout" class="sidebar-item sidebar-logout">
          <span>Esci</span>
        </button>
      </div>
    </nav>

    <div class="header">
      <div class="header-left">
        <button
          type="button"
          id="hamburger-btn"
          class="hamburger-btn"
          aria-label="Apri il menu"
          aria-controls="sidebar"
        >
          Menu
        </button>
        <span class="header-title">Report</span>
      </div>
    </div>

    <div class="container">
      <h2 class="page-title">Resoconto Clientela</h2>
      <p class="page-subtitle">Statistiche prenotazioni ed interventi effettuati</p>

      <div class="reports-container">
        <div class="filter-container">
          <label for="period-filter" class="filter-label">Periodo:</label>
          <select id="period-filter" class="filter-select">
            <option value="weekly">Settimana</option>
            <option value="monthly">Mese</option>
          </select>
        </div>

        <div class="chart-container">
          <canvas id="bookings-chart"></canvas>
        </div>

        <div class="stats-summary">
          <div class="stat-card">
            <div id="total-bookings" class="stat-value">0</div>
            <div class="stat-label">Totale Interventi</div>
          </div>
          <div class="stat-card">
            <div id="avg-bookings" class="stat-value">0</div>
            <div class="stat-label">Media Giornaliera</div>
          </div>
          <div class="stat-card">
            <div id="max-bookings" class="stat-value">0</div>
            <div class="stat-label">Giorno Migliore</div>
          </div>
        </div>
      </div>
    </div>

    <script src="/js/theme.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/vendor/chart.umd.js"></script>
    <script src="/js/admin-reports.js"></script>
  </body>
</html>
